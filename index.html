<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>adgyn – Local advertising, reimagined</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F5F0EB;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .wordmark {
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 10vw, 4rem);
      font-weight: bold;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .wordmark span { color: #6B3FA0; }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: normal;
      color: #444;
      max-width: 520px;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    .cta {
      display: inline-block;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .cta:hover { opacity: 0.8; }

    footer {
      position: fixed;
      bottom: 24px;
      font-size: 0.78rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="wordmark">ad<span>gyn</span></div>
  <h1>Local advertising, reimagined.<br>Put your business in front of the right neighbors.</h1>
  <a class="cta" href="mailto:hello@adgyn.com">Get Early Access</a>

  <footer>© 2026 adgyn</footer>

</body>
</html>
